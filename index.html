    connectedCallback() {

        this.shadow.querySelector(

        this.initEventListeners();

        );

    disconnectedCallback() {

        if (this.animationFrameId) {

            cancelAnimationFrame(

            );

        }


        if (this.lockTimer) {

            clearTimeout(
                this.lockTimer
            );

        }

    /* =====================================================
       UNLOCK STATUS
       ===================================================== */

    checkUnlockStatus() {

        const saved =
            localStorage.getItem(
                "cricxcrate_unlocked_time"
            );


        if (saved) {

            if (

                Date.now() -
                parseInt(saved, 10)

                <

                24 *
                60 *
                60 *
                1000

            ) {

                this.isUnlocked =
                    true;

            } else {

                localStorage.removeItem(
                    "cricxcrate_unlocked_time"
                );

            }

        }


        if (!this.isUnlocked) {

            setTimeout(() => {

                const desc =
                    this.shadow.querySelector(
                        "#tgModalDesc"
                    );


                const modal =
                    this.shadow.querySelector(
                        "#tgPremiumModal"
                    );


                if (desc) {

                    desc.innerText =
                        "Join Our Telegram Channel For 24-Hour Full Access To Uninterrupted HD Live Streams And Updates.";

                }


                if (modal) {

                    modal.classList.add(
                        "show"
                    );

                }

            }, 200);

        }

    }


    /* =====================================================
       FETCH CHANNELS
       ===================================================== */

    async fetchChannels() {

        const grid =
            this.shadow.querySelector(
                "#channels-grid"
            );


        try {

            const res =
                await fetch(
                    window.CricConfig.sourceUrl
                );


            if (!res.ok) {

                throw new Error(
                    "HTTP " +
                    res.status
                );

            }


            const data =
                await res.json();


            this.masterChannels =
                Array.isArray(data)

                    ? data

                    : (
                        data.iframes ||
                        data.channels ||
                        data.streams ||
                        data.data ||
                        Object.entries(data || {}).map(
                            ([id, url]) => ({
                                id,
                                title: id,
                                url
                            })
                        )
                    );


            if (
                this.masterChannels.length === 0
            ) {

                grid.innerHTML =
                    `
                    <div class="state-container">
                        No channels found.
                    </div>
                    `;

                return;
            }


            this.renderGrid();

            this.handleUrlRouting();


        } catch (err) {

            console.error(
                "Channel feed error:",
                err
            );


            grid.innerHTML =
                `
                <div
                    class="state-container"
                    style="color:#ef4444;"
                >
                    Failed to load channels feed.
                </div>
                `;

            if (this.initialPendingId) {

                this.closePlayer();

            }

        }

    }

    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       OPEN PLAYER
       ===================================================== */

    openPlayer(identifier) {

        const target =
            this.masterChannels.find(
                (ch, idx) =>
                    ch.id == identifier ||
                    idx == identifier
            );


        if (!target) {
            this.closePlayer();
            return;
        }


        let streamUrl =

            target.iframeSrc ||

            target.url ||

            target.link ||

            target.stream ||

            target.file ||

            target.source ||

            target.src;


        if (!streamUrl) {

            streamUrl =
                `https://sonucdn-v2.pages.dev/star.html?id=${encodeURIComponent( 
                    target.id || 
                    identifier 
                )}`; 
 
        } 
 
 
        const title = 
 
            target.title || 
 
            target.name || 
 
            target.channel || 
 
            "Live Broadcast"; 
 
 
        this.currentStreamId = 
            identifier; 
 
 
        this.shadow.querySelector( 
            "#activeStreamTitleDisplay" 
        ).innerText = 
            title; 
 
 
        this.shadow.querySelector( 
            "#player" 
        ).src = 
            streamUrl; 


        const loadingOverlay = 
            this.shadow.querySelector( 
                "#streamLoadingOverlay" 
            ); 

        if (loadingOverlay) { 

            loadingOverlay.classList.add( 
                "hidden" 
            ); 

        } 
 
 
        this.shadow.querySelector( 
            "#home-view" 
        ).classList.remove( 
            "active" 
        ); 
 
 
        this.shadow.querySelector( 
            "#player-view" 
        ).classList.add( 
            "active" 
        ); 
 
 
        if (!this.isUnlocked) { 
 
            if (this.lockTimer) { 
 
                clearTimeout( 
                    this.lockTimer 
                ); 
 
            } 
 
 
            this.lockTimer = 
                setTimeout( 
                    () => 
                        this.triggerLock(), 
 
                    window.CricConfig 
                        .previewDuration 
                ); 
 
        } 
 
 
        const query = 
            `?id=${encodeURIComponent( 
                identifier 
            )}`; 
 
 
        if ( 
            window.location.search !== 
            query 
        ) { 
 
            history.pushState( 
                { 
                    playerOpen: 
                        true, 
 
                    id: 
                        identifier 
                }, 
 
                "", 
 
                query 
            ); 
 
        } 
 
 
        window.scrollTo( 
            0, 
            0 
        ); 
 
    } 
 
 
    /* ===================================================== 
       CLOSE PLAYER 
       ===================================================== */ 
 
    closePlayer() { 
 
        this.shadow.querySelector( 
            "#player" 
        ).src = 
            "about:blank"; 
 
 
        const loadingOverlayEl = 
            this.shadow.querySelector( 
                "#streamLoadingOverlay" 
            ); 
 
        if (loadingOverlayEl) { 
 
            loadingOverlayEl.classList.add( 
                "hidden" 
            ); 
 
        } 
 
 
        if (this.lockTimer) { 
 
            clearTimeout( 
                this.lockTimer 
            ); 
 
            this.lockTimer = 
                null; 
        } 
 
 
        this.shadow.querySelector( 
            "#tgPremiumModal" 
        ).classList.remove( 
            "show" 
        ); 
 
 
        try { 
 
            if ( 
                document.fullscreenElement 
            ) { 
 
                document.exitFullscreen() 
                    .catch( 
                        () => {} 
                    ); 
 
            } 
 
        } catch (err) {} 
 
 
        this.shadow.querySelector( 
            "#playerContainer" 
        ).classList.remove( 
            "fs-active" 
        ); 
 
 
        this.shadow.querySelector( 
            "#themeSwitchDeck" 
        ).classList.remove( 
            "hidden" 
        ); 
 
 
        this.shadow.querySelector( 
            "#player-view" 
        ).classList.remove( 
            "active" 
        ); 
 
 
        this.shadow.querySelector( 
            "#home-view" 
        ).classList.add( 
            "active" 
        ); 
 
 
        this.currentStreamId = 
            null; 
 
 
        if ( 
            window.location.search !== 
            "" 
        ) { 
 
            history.pushState( 
                {}, 
                "", 
                window.location.pathname 
            ); 
 
        } 
 
    } 
 
 
    /* ===================================================== 
       URL ROUTING 
       ===================================================== */ 
 
    handleUrlRouting() { 
 
        const params = 
            new URLSearchParams( 
                window.location.search 
            ); 
 
 
        const id = 
            params.get( 
                "id" 
            ); 
 
 
        if ( 
            id !== null && 
            this.masterChannels.length > 0 
        ) { 
 
            this.openPlayer( 
                id 
            ); 
 
        } else if ( 
            id === null && 
            this.currentStreamId !== null 
        ) { 
 
            this.closePlayer(); 
 
        } 
 
    } 
 
 
    /* ===================================================== 
       LOCK 
       ===================================================== */ 
 
    triggerLock() { 
 
        if (this.isUnlocked) 
            return; 
 
 
        const iframe = 
            this.shadow.querySelector( 
                "#player" 
            ); 
 
 
        try { 
 
            if ( 
                iframe && 
                iframe.contentWindow 
            ) { 
 
                iframe.contentWindow.postMessage( 
                    "cricxcrate-force-pause", 
                    "*" 
                ); 
 
            } 
 
        } catch (e) {} 
 
 
        try { 
 
            if ( 
                document.fullscreenElement 
            ) { 
 
                document.exitFullscreen() 
                    .catch( 
                        () => {} 
                    ); 
 
            } 
 
        } catch (err) {} 
 
 
        this.shadow.querySelector( 
            "#tgModalDesc" 
        ).innerText = 
            "Free Preview Ended! Join Our Telegram To Unlock 24-Hour Uninterrupted Access With Zero Locks."; 
 
 
        this.shadow.querySelector( 
            "#tgPremiumModal" 
        ).classList.add( 
            "show" 
        ); 
 
    }

       MESSAGE LISTENER 
       ===================================================== */ 
 
    setupMessageListener() { 
 
        window.addEventListener( 
            "message", 
            (e) => { 
 
                if ( 
 
                    e.data === 
                    "cricxcrate-playing" && 
 
                    !this.isUnlocked && 
 
                    !this.lockTimer 
 
                ) { 
 
                    this.lockTimer = 
                        setTimeout( 
 
                            () => 
                                this.triggerLock(), 
 
                            window.CricConfig 
                                .previewDuration 
 
                        ); 
 
                } 
 
            } 
        ); 
 
 
        document.addEventListener( 
            "fullscreenchange", 
            () => { 
 
                const rig = 
                    this.shadow.querySelector( 
                        "#playerContainer" 
                    ); 
 
 
                const themeDeck = 
                    this.shadow.querySelector( 
                        "#themeSwitchDeck" 
                    ); 
 
 
                const fsIconSvg = 
                    this.shadow.querySelector( 
                        "#fsIconSvg" 
                    ); 
 
 
                if ( 
 
                    !document.fullscreenElement && 
 
                    !document.webkitIsFullScreen && 
 
                    rig 
 
                ) { 
 
                    rig.classList.remove( 
                        "fs-active" 
                    ); 
 
 
                    if (themeDeck) { 
 
                        themeDeck.classList.remove( 
                            "hidden" 
                        ); 
 
                    } 
 
 
                    if (fsIconSvg) { 
 
                        fsIconSvg.innerHTML = 
                            `

        /* LIGHT THEME */ 
 
        this.shadow.querySelector( 
            "#themeLightBtn" 
        ).onclick = 
            () => { 
 
                this.setAttribute( 
                    "data-theme", 
                    "light" 
                ); 
 
 
                this.shadow.querySelector( 
                    "#themeLightBtn" 
                ).classList.add( 
                    "active" 
                ); 
 
 
                this.shadow.querySelector( 
                    "#themeDarkBtn" 
                ).classList.remove( 
                    "active" 
                ); 
 
            }; 
 
 
        /* SHARE */ 
 
        const btnShare = 
            this.shadow.querySelector( 
                "#btnShare" 
            ); 
 
 
        const shareText = 
            this.shadow.querySelector( 
                "#shareBtnText" 
            ); 
 
 
        btnShare.onclick = 
            async () => { 
 
                try { 
 
                    if ( 
                        navigator.share 
                    ) { 
 
                        await navigator.share({ 
 
                            title: 
                                "SHANAEDITX Live", 
 
                            url: 
                                window.location.href 
 
                        }); 
 
                    } else { 
 
                        await navigator.clipboard 
                            .writeText( 
                                window.location.href 
                            ); 
 
 
                        shareText.textContent = 
                            "COPIED!"; 
 
 
                        setTimeout( 
                            () => { 
 
                                shareText.textContent = 
                                    "SHARE STREAM"; 
 
                            }, 
                            1800 
                        ); 
 
                    } 
 
                } catch (err) {} 
 
            }; 
 
    } 
 
 
    /* ===================================================== 
       WARP FIELD 
       ===================================================== */ 
 
    initWarpField() { 
 
        const canvas = 
            this.shadow.getElementById( 
                "warpGridCanvas" 
            ); 
 
 
        if (!canvas) 
            return; 
 
 
        const ctx = 
            canvas.getContext( 
                "2d" 
            ); 
 
 
        const resize = 
            () => { 
 
                canvas.width = 
                    window.innerWidth; 
 
                canvas.height = 
                    window.innerHeight; 
 
            }; 
 
 
        window.addEventListener( 
            "resize", 
            resize 
        ); 
 
 
        resize(); 
 
 
        for ( 
            let i = 0; 
            i < 100; 
            i++ 
        ) { 
 
            this.stars.push({ 
 
                x: 
                    Math.random() * 
                    canvas.width, 
 
                y: 
                    Math.random() * 
                    canvas.height, 
 
                length: 
                    Math.random() * 
                    20 + 
                    10, 
 
                speed: 
                    Math.random() * 
                    2 + 
                    1, 
 
                alpha: 
                    Math.random() * 
                    0.5 + 
                    0.1 
 
            }); 
 
        } 
 
 
        const render = 
            () => { 
 
                ctx.clearRect( 
                    0, 
                    0, 
                    canvas.width, 
                    canvas.height 
                ); 
 
 
                ctx.lineWidth = 
                    1.2; 
 
 
                this.stars.forEach( 
                    (star) => { 
 
                        ctx.strokeStyle = 
                            `rgba( 
                                0, 
                                255, 
                                204, 
                                ${star.alpha} 
                            )`; 
 
 
                        ctx.beginPath(); 
 
 
                        ctx.moveTo( 
                            star.x, 
                            star.y 
                        ); 
 
 
                        ctx.lineTo( 
                            star.x + 
                            star.length, 
 
                            star.y 
                        ); 
 
 
                        ctx.stroke(); 
 
 
                        star.x += 
                            star.speed; 
 
 
                        if ( 
                            star.x > 
                            canvas.width 
                        ) { 
 
                            star.x = 
                                -star.length; 
 
 
                            star.y = 
                                Math.random() * 
                                canvas.height; 
 
                        } 
 
                    } 
                ); 
 
 
                this.animationFrameId = 
                    requestAnimationFrame( 
                        render 
                    ); 
 
            }; 
 
 
        render(); 
 
    } 
 
}

customElements.define(

    CricXCrateUI 
);
